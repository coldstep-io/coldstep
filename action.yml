name: Coldstep eBPF CI Egress
author: coldstep.io
description: >-
  eBPF egress telemetry and optional cgroup defend for GitHub-hosted ubuntu-latest CI runners (v1).
branding:
  icon: shield
  color: blue

inputs:
  # --- Core inputs (document these in README) ---

  mode:
    description: >-
      Runtime mode: detect (default) or defend (blocking, requires allowlist).
      defend blocks IPv4 and IPv6 TCP/UDP egress not on the allowlist: cgroup
      connect4/sendmsg4 + connect6/sendmsg6 hooks always; BPF LSM twins
      (socket_connect/socket_sendmsg, IPv4 and IPv6) additionally enforce on
      kernels with CONFIG_BPF_LSM=y and bpf in the boot lsm= chain (not
      GitHub-hosted runners). Loopback (127.0.0.0/8, ::1), the unspecified
      address (0.0.0.0, ::) — which the kernel rewrites to loopback after the
      hooks observe it — and IPv6 link-local (fe80::/10) always bypass, and
      the host's configured DNS resolvers (resolv.conf /
      systemd-resolved upstreams) are auto-allowed so workload DNS keeps
      working — opt out with env COLDSTEP_NO_RESOLVER_AUTOALLOW=1 and
      allowlist resolver IPs explicitly. QUIC/HTTP3 payloads, Unix sockets,
      and io_uring connect are not blocked. See SECURITY.md for full coverage
      boundaries.
    required: false
    default: detect

  allow:
    description: >-
      Comma- or newline-separated egress allowlist — the single list source.
      Accepts plain domains (example.com), wildcard domains (*.example.com),
      IPv4 and IPv6 literals (1.2.3.4, 2001:db8::1), and CIDRs (10.0.0.0/8,
      2001:db8::/32). Prefix an IPv4 CIDR with ! to ignore that net
      (e.g. !192.168.0.0/16) — this is the only ignore mechanism (see
      no-default-ignored-nets for the implicit RFC1918 ignores; the ignore trie
      is IPv4-only). Entries are auto-classified: IP/CIDR → allowed-ips,
      !CIDR → ignored nets, domain/wildcard → allowed-hosts + allowed-domains.
      Merged with allow-file. In defend mode each domain is resolved for both A
      and AAAA records; matching IPv4 and IPv6 addresses populate the BPF
      allowlists, and literal IPv6 entries are programmed into the allowed_ipv6
      LPM trie alongside them (SP-2). Wildcard entries
      (*.example.com) are detect-only — they are rejected at parse time when
      mode=defend, because the BPF allowed_domains map uses exact-string lookup.
    required: false
    default: ''

  allow-file:
    description: >-
      Comma-separated paths to UTF-8 text files (one entry per line or comma-separated; # comments).
      Same format as allow; entries are classified and merged automatically.
    required: false
    default: ''

  detect-profile:
    description: >-
      Detect mode only: standard (default) or enhanced. Enhanced enables the
      proc_tree / tls_sni / fs_events streams and sets COLDSTEP_DETECT_PROFILE for
      the agent. Use the same value when running coldstep-action assert-integrity
      (or stop --strict) so the required-event-type gate matches the run.
    required: false
    default: standard

  report:
    description: >-
      Where to post the detect digest. job-summary (default): append to the job Summary tab.
      pr-comment: post as a PR comment (pull_request events only; requires github-token).
      both: job summary and PR comment.
      none: discard the digest.
      Deprecated report-job-summary and report-pr-summary inputs override this if set explicitly.
    required: false
    default: job-summary

  digest-output:
    description: >-
      Optional path for the rendered Markdown digest. The stop step always writes
      the digest to ./.coldstep-<mode>.md (mode = detect or defend) by default, so
      consumers can read it without opt-in; set this to write it elsewhere instead.
      Relative paths resolve under GITHUB_WORKSPACE. The fixed-name .coldstep-report.md
      artifact is still written regardless.
    required: false
    default: ''

  fail-on-error:
    description: >-
      If true, fail when the agent never reports operational readiness after startup attach succeeds.
      Defend mode defaults to true when this input is not set explicitly.
      Detect mode defaults to false: workflow steps run immediately without
      waiting for BPF attach, so a short job can finish before any telemetry
      is captured (the stop step then emits a "no events captured" warning and
      the report verdict says so). Recommended: set true for short detect jobs
      so the run waits for readiness and the telemetry actually proves something.
      Detect requires sched_process_exec; connect/sendto/HTTP/DNS sniff are best-effort.
      Defend additionally requires syscall tracing and cgroup programs.
    required: false
    default: ''

  # --- Advanced inputs (document in Advanced section) ---

  signing-key:
    description: >-
      Optional base64-encoded Ed25519 seed (32 bytes) or private key (64 bytes) for telemetry signing.
      When set, every emitted JSONL event is signed.
    required: false
    default: ''

  log-level:
    description: Agent log level written to stderr (debug, info, warn, error).
    required: false
    default: info

  github-token:
    description: >-
      GitHub token used when report is pr-comment or both to post a PR comment
      (pull_request workflows only).
    required: false
    default: ${{ github.token }}

  no-default-ignored-nets:
    description: >-
      When true, do not merge the implicit 10.0.0.0/8 and 172.16.0.0/12 ignores;
      only the !CIDR entries from allow / allow-file are used (may be empty).
    required: false
    default: 'false'

  ready-timeout-seconds:
    description: >-
      Only when fail-on-error is true: maximum seconds to wait for .coldstep-ready.json with ok:true (default 1500).
      Values are clamped between 60 and 2700. If the agent writes ok:false or an invalid payload, the step fails
      immediately without waiting (saves runner minutes).
    required: false
    default: ''

  # --- Internal (do not document in README) ---
  #
  # phase is the only legacy lifecycle input still supported. The in-repo CI
  # workflows use `uses: ./` (local refs do not fire node24 pre/post hooks),
  # so they call `phase: start` / `phase: stop` manually. Consumer workflows
  # should omit phase and let the action's pre/post lifecycle handle start/stop.

  phase:
    description: >-
      Legacy lifecycle. Omit for the standard pre/post pattern (single uses:
      block per job). Set to start to invoke main as start logic, stop to
      invoke main as stop logic — required when consuming the action via a
      local `uses: ./` reference, since GitHub Actions does not fire node24
      pre/post hooks for local refs.
    required: false
    default: ''

  release-path:
    description: 'Internal debug: path to a prebuilt coldstep binary. When set and the file exists, skips downloading the published release asset.'
    required: false
    default: ''

  smoke-test-egress:
    description: >-
      Internal. When true, fire short IPv4 UDP sendto and cleartext HTTP probes after the agent starts
      so the digest commonly shows udp/http rows on ubuntu-latest (opt-in extra egress).
    required: false
    default: 'false'

  io-uring-disable:
    description: >-
      Internal. When true (default), disables io_uring via sysctl before the agent starts.
      io_uring operations bypass syscall-based eBPF hooks; disabling it closes the single
      largest evasion vector for CI workloads that do not need io_uring. The agent also
      adds best-effort detection via raw_tp/io_uring_submit_sqe (kernel 5.14+) that
      surfaces socket-class io_uring SQEs (SEND, SENDMSG) in the JSONL stream and digest
      when the sysctl gate is bypassed or set to false. When detect-profile=enhanced,
      the probe additionally attempts a bounded bpf_probe_read_user peek on the SQE user
      buffer and flags submissions whose prefix matches the TLS ClientHello signature,
      surfacing outbound TLS over io_uring under "🚨 io_uring TLS ClientHello prefixes".
      The sysctl disable remains the primary defense.
    required: false
    default: 'true'

outputs:
  suggested-allow:
    description: >-
      Comma-separated allowlist suggested from the destinations observed during a detect-mode run
      (empty in defend mode or when no events were captured). Hostnames seen via DNS/SNI/HTTP take
      priority over the raw IPs they resolved to. Paste directly into the action's `allow:` input.

runs:
  using: node24
  pre: dist/pre/index.js
  main: dist/main/index.js
  post: dist/post/index.js
