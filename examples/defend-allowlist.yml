# Example: coldstep in defend mode (block non-allowlisted egress).
#
# Defend mode blocks IPv4 (and IPv6) TCP/UDP egress to destinations that are
# not on the effective allowlist. A non-empty allowlist is REQUIRED — defend
# mode refuses to start without one.
#
# The `allow` input below permits the two domains an `npm install` needs:
#   - registry.npmjs.org  (package metadata + tarballs)
#   - nodejs.org          (used by some packages for Node headers / binaries)
#
# Loopback (127.0.0.0/8, ::1), the unspecified address (0.0.0.0, ::), and the
# runner's configured DNS resolvers always bypass. Any other egress not on the
# allowlist is dropped by the cgroup connect/sendmsg hooks. BPF LSM hooks also
# enforce on kernels that boot with bpf in the lsm= list; GitHub-hosted
# runners do not.
#
# Requirements: GitHub-hosted `ubuntu-latest` (see README → Requirements).

name: defend-allowlist

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: coldstep-io/coldstep@v0.6.2
        with:
          mode: defend
          # Allowlist: comma- or newline-separated domains, IPv4/IPv6
          # literals/CIDRs, and `!CIDR` ignore entries. Wildcards are
          # rejected in defend. Domains are resolved (A/AAAA) at startup.
          allow: |
            registry.npmjs.org
            nodejs.org
          fail-on-error: true
          log-level: info

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # This install only touches allowlisted destinations, so it succeeds.
      # Add a step that reaches some other host and defend mode will drop it.
      - run: npm install express

      # The stop step writes the digest to .coldstep-defend.md by default.
      # Upload it without a custom extractor.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coldstep-defend-digest
          path: .coldstep-defend.md
