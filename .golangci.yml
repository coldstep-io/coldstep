version: "2"
linters:
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errcheck
    - gosec
  exclusions:
    paths:
      - "internal/bpf/"
    rules:
      - path: "_test\\.go"
        linters: [gosec]
      - path: "internal/bpf/"
        linters: [typecheck]
formatters:
  enable:
    - gofmt
