# Red-team eBPF audit and integrity validation.
# This workflow intentionally triggers sensitive events (BPF map access, 
# network probes, etc.) and asserts that Coldstep captures them with 
# high integrity.
#
# Anti-blindness gating: fails if integrity score is zero (mandatory canaries missing).

name: coldstep-redteam-ebpf

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      fail_on_blindness:
        description: Fail the job if telemetry integrity/canaries are missing
        type: boolean
        default: true

env:
  COLDSTEP_AGENT_VERSION: v0.6.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      NS_RUNNER_LABEL: ubuntu-latest-redteam
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version-file: go.mod

      - name: Build coldstep agent
        run: |
          bash scripts/build-agent-linux.sh "$GITHUB_WORKSPACE"
          mv bin/coldstep bin/coldstep-built
          chmod +x bin/coldstep-built
          # For release-path compatibility in next step
          cp bin/coldstep-built bin/coldstep

      # Install packages before starting Coldstep so apt/dpkg filesystem noise
      # does not exhaust the agent's fs_event JSONL cap (5k lines) before canary chmod.
      - name: Install runtime tools
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nmap dnsutils linux-tools-common linux-tools-generic linux-tools-azure

      - name: Start Coldstep (detect mode with full audit gates)
        uses: ./
        with:
          phase: start
          mode: detect
          log-level: info
          report: none
          allow: theclouddj.com, *.ubuntu.com
          detect-profile: enhanced
          release-path: bin/coldstep

      - name: Red-team probes (Generate Telemetry)
        # Probe cases live in redteam/<case>/probe.sh (each with a README);
        # run-all.sh runs them in order and drains the ring readers before stop.
        run: bash redteam/run-all.sh theclouddj.com
      - name: Stop Coldstep (flush digest)
        uses: ./
        with:
          phase: stop
          report: none
          fail-on-error: 'false'

      - name: Apply Anti-Blindness Gating
        if: github.event_name != 'workflow_dispatch' || inputs.fail_on_blindness == true
        run: ./bin/coldstep assert-integrity --in "${GITHUB_WORKSPACE}/.coldstep-events.jsonl"

      - name: Upload Redteam Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coldstep-redteam-report
          path: ${{ github.workspace }}/.coldstep-report.md
          retention-days: 7
          overwrite: true
          include-hidden-files: true
          if-no-files-found: warn

  # H20 — red-team validation integration tests.
  # Asserts coldstep surfaces the 12 v0.4.0 security-review attack paths as
  # JSONL events (detect mode) or deny/pass behaviour (defend mode). Run on
  # ubuntu-latest only: BPF load requires root + hosted-runner kernel features
  # not assumed on WSL/older releases (see skipIfUnsupportedSyscallBPFKernel).
  redteam-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version-file: go.mod

      - name: Prepare BPF toolchain (clang, libbpf, vmlinux.h)
        # build-agent-linux.sh installs clang/llvm/libbpf-dev, dumps BTF to
        # bpf/vmlinux.h if missing, and runs `go generate` for every BPF probe
        # package — the integration tests import those generated objects, so
        # we run the full build script (and discard the built binaries).
        run: bash scripts/build-agent-linux.sh "$GITHUB_WORKSPACE"

      - name: Run red-team integration tests (TestRedTeam_*)
        # sudo: BPF load + cgroup/LSM attach require CAP_SYS_ADMIN.
        # -tags=integration: matches //go:build integration && linux && !windows.
        # -parallel 1: BPF programs attach to per-runner cgroups; serializing
        # avoids cross-test deny-ring interference.
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" \
            go test -tags=integration ./internal/agent/... \
              -run '^TestRedTeam_' \
              -count=1 \
              -parallel 1 \
              -timeout 15m \
              -v
