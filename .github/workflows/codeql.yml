# Advanced CodeQL — languages exclude Python (this repository ships no Python sources).
# If GitHub still runs Code scanning "Default setup" as well, disable Default setup under
# Settings → Code security → Code scanning for this repository to avoid duplicate uploads.
name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - go
          - javascript-typescript
          - cpp
          - actions

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        if: matrix.language == 'go'
        with:
          go-version: '1.25.x'

      - uses: actions/setup-node@v6
        if: matrix.language == 'javascript-typescript'
        with:
          node-version: '24'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
