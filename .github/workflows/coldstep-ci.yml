# PR / main / workflow_dispatch CI (v1): reusable runner workflow runs unit+integration on ubuntu-latest /
# Expensive checks (govulncheck, go test -shuffle, optional full-module race): coldstep-ci-nightly.yml (cron + manual).
# ubuntu-22.04 (x64) and ubuntu-24.04-arm / ubuntu-22.04-arm (arm64); detect/defend remain ubuntu-latest x64.

name: coldstep-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ci_preset:
        description: CI preset (default = normal, fast = skip integration, strict = extra defend/diff gates)
        type: choice
        options:
          - default
          - fast
          - strict
        default: default

permissions:
  contents: read
  actions: read

# Do not cancel in-flight runs: defend-mode can spend 20+ minutes in BPF verifier/load before the
# composite action sees .coldstep-ready.json; a new push would cancel mid-wait and look like a timeout.
concurrency:
  group: coldstep-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted-linux:
    uses: ./.github/workflows/coldstep-ci-runner.yml
    with:
      coldstep_diff_strict: ${{ github.event_name != 'workflow_dispatch' || inputs.ci_preset == 'strict' }}
      defend_deny_jsonl_strict: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_preset == 'strict' || false }}
      skip_integration: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_preset == 'fast' || false }}
    secrets: inherit

  lint:
    name: golangci-lint
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare BPF and generated Go
        run: bash scripts/build-agent-linux.sh "$GITHUB_WORKSPACE"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  dist-up-to-date:
    # Fails the PR if committed dist/ bundles do not match what `npm run build` produces
    # from current src/*.ts. Catches the recurring "stale dist after a src change" drift.
    name: dist/ matches src/
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild dist/
        run: npm run build

      - name: Fail if dist/ drifted
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is stale — run 'npm run build' locally and commit the result."
            echo "::group::dist/ diff (first 200 lines)"
            git diff -- dist/ | head -200
            echo "::endgroup::"
            exit 1
          fi
