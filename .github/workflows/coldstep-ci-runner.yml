# Reusable CI + Coldstep detect/defend. Agent/BPF build + unit tests + integration run on **ubuntu-latest** /
# **ubuntu-22.04** (x64) and **ubuntu-24.04-arm** / **ubuntu-22.04-arm** (arm64). Detect/defend stay on ubuntu-latest.

name: coldstep-ci runner

on:
  workflow_call:
    inputs:
      coldstep_diff_strict:
        description: When true, detect-mode fails if previous-run JSONL diff cannot be computed
        type: boolean
        default: true
      defend_deny_jsonl_strict:
        description: When true, defend-mode fails if no deny JSONL rows appear after defend smoke (stricter than default variance-tolerant path)
        type: boolean
        default: false
      skip_integration:
        description: When true, skip the integration matrix (faster manual runs)
        type: boolean
        default: false

# Default to least-privilege for every job in this reusable workflow.
# Jobs that legitimately need more (e.g. `actions: read` to download a
# previous-run baseline artifact for JSONL diff) override this block at the
# job level — see `coldstep-demo-detect.yml` for the same pattern.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Authoritative gofmt on hosted Linux (same Go toolchain pin as unit/integration jobs).
  gofmt:
    name: Go format
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: AGENTS.md must not be tracked
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch AGENTS.md >/dev/null 2>&1; then
            echo "::error::AGENTS.md is listed in the git index. It must remain gitignored and local-only; remove with git rm --cached AGENTS.md and drop any commit that adds it."
            exit 1
          fi
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: go.mod
      - name: gofmt check
        run: bash scripts/check-gofmt.sh
      - name: encoding check
        run: bash scripts/check-encoding.sh

  action_manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

  # Dedicated security linter. Complements `staticcheck` in unit jobs by flagging
  # crypto / SSRF / hardcoded-credential issues. The excluded rules below are
  # systemic false-positives for this codebase (a CI security agent that, by
  # design, reads paths from controlled env vars and runs sudo sub-processes):
  #   G104 unchecked errors          — covered by errcheck / staticcheck SA4006
  #   G204 subprocess with variable  — agent re-executes itself via `sudo -E binPath`
  #   G301 dir perms 0750+           — 0755 needed for CI-shared workspace dirs
  #   G302 file perms 0600+          — 0644 needed for digest/JSONL files consumed by later steps
  #   G304 file inclusion variable   — CLI tool reads paths from CLI flags / GITHUB_* env
  #   G306 WriteFile perms 0600+     — same rationale as G302
  #   G703 path-traversal taint      — taint sources are GITHUB_EVENT_PATH / GITHUB_STEP_SUMMARY (trusted)
  #   G704 SSRF taint                — outbound calls are GitHub API URLs built from GITHUB_REPOSITORY (trusted)
  gosec:
    name: gosec
    needs: [gofmt]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Prepare BPF and generated Go
        run: bash scripts/build-agent-linux.sh "$GITHUB_WORKSPACE"
      - name: Run gosec
        uses: securego/gosec@9e6a9843d7a4a6e3e9a8539b02612c8a4aa3f889 # v2.27.1
        with:
          args: '-exclude=G104,G204,G301,G302,G304,G306,G703,G704 ./...'

  # Dedicated staticcheck job (also embedded in unit/integration jobs for
  # parallel cross-OS coverage). Keeps a single fast lint signal on the
  # critical path even when those longer jobs are skipped.
  staticcheck:
    name: staticcheck
    needs: [gofmt]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Prepare BPF and generated Go
        run: bash scripts/build-agent-linux.sh "$GITHUB_WORKSPACE"
      - name: Install staticcheck
        env:
          GOTOOLCHAIN: auto
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run staticcheck
        run: staticcheck ./...

  unit:
    name: unit (${{ matrix.os }})
    needs: [gofmt]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: go.mod
      - name: Prepare BPF and generated Go
        run: bash scripts/build-agent-linux.sh "$GITHUB_WORKSPACE"
      - name: Go vet
        run: go vet ./...
      - name: staticcheck
        env:
          GOTOOLCHAIN: auto
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          staticcheck ./...
      - name: Unit tests
        run: go test ./... -count=1
      - name: Race detector (Go agent)
        run: go test -race -count=1 ./internal/agent/... -timeout 15m

  unit-arm64:
    name: unit-arm64 (${{ matrix.os }})
    needs: [gofmt]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: go.mod
      - name: Prepare BPF and generated Go
        run: bash scripts/build-agent-linux.sh "$GITHUB_WORKSPACE"
      - name: Go vet
        run: go vet ./...
      - name: staticcheck
        env:
          GOTOOLCHAIN: auto
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          staticcheck ./...
      - name: Unit tests
        run: go test ./... -count=1
      - name: Race detector (Go agent)
        run: go test -race -count=1 ./internal/agent/... -timeout 15m

  # Integration can be skipped in two ways:
  # 1) workflow input skip_integration=true (used by coldstep-ci.yml fast preset)
  # 2) repository variable COLDSTEP_SKIP_INTEGRATION=1 (global override)
  integration:
    if: ${{ !inputs.skip_integration && vars.COLDSTEP_SKIP_INTEGRATION != '1' }}
    name: integration (${{ matrix.os }})
    needs: [gofmt]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, ubuntu-24.04-arm, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: go.mod
      - name: Prepare BPF
        run: bash scripts/build-agent-linux.sh "$GITHUB_WORKSPACE"
      - name: Kernel staleness check (P2-4)
        # Annotate when the integration runner kernel drifts >2 major versions
        # past the minimum supported (5.15). Drift here means the integration
        # job is no longer exercising the floor of the supported range, so a
        # regression on older kernels could slip through unnoticed. Warn-only:
        # the kernel matrix workflow (.github/workflows/coldstep-kernel-matrix.yml)
        # is the long-term home for pinned coverage.
        run: |
          set -eu
          RUNNER_KERNEL=$(uname -r | cut -d. -f1-2)
          MIN_KERNEL="5.15"
          echo "Runner kernel: $RUNNER_KERNEL, min supported: $MIN_KERNEL"
          runner_major=$(echo "$RUNNER_KERNEL" | cut -d. -f1)
          min_major=$(echo "$MIN_KERNEL" | cut -d. -f1)
          delta=$((runner_major - min_major))
          if [ "$delta" -gt 2 ]; then
            echo "::warning title=Kernel staleness::Runner kernel $RUNNER_KERNEL is >2 major versions ahead of minimum supported $MIN_KERNEL — older-kernel regressions may not surface in this job; rely on coldstep-kernel-matrix.yml"
          fi
      - name: Go vet
        run: go vet ./...
      - name: staticcheck
        env:
          GOTOOLCHAIN: auto
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          staticcheck ./...
      - name: Integration tests (root)
        run: sudo env "PATH=$PATH" go test -tags=integration ./internal/agent/... -count=1 -parallel 1

  action_bundle:
    needs: [gofmt]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: go.mod
      - name: Build action binaries
        run: bash scripts/build-agent-linux.sh "${GITHUB_WORKSPACE}"
      - name: Verify action binary exists
        run: |
          set -euo pipefail
          test -x bin/coldstep

  detect-mode:
    needs: [gofmt]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      COLDSTEP_DIFF_PREV_RUN: '1'
      COLDSTEP_DIFF_STRICT: ${{ inputs.coldstep_diff_strict == true && '1' || '0' }}
      NS_RUNNER_LABEL: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: go.mod

      # Demo-class smoke: consume the prebuilt build (the action downloads the
      # released coldstep binary), never compile source here. The combined
      # binary's report/diff/assert-integrity subcommands are validated by the
      # from-source unit/integration/redteam jobs; the subcommand post-checks are
      # re-enabled here once a release ships the combined binary and the pin is
      # bumped (Train-2). This job asserts the JSONL stream inline instead.
      - name: Start Coldstep (detect mode)
        uses: ./
        with:
          phase: start
          mode: detect
          detect-profile: enhanced
          allow: theclouddj.com, *.ubuntu.com

      - name: Install runtime probes
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nmap dnsutils netcat-openbsd curl linux-tools-common linux-tools-generic linux-tools-azure

      - name: Assert required tools are present
        run: |
          set -euo pipefail
          command -v dig
          command -v nc
          command -v nmap
          command -v curl

      - name: Capability probes (detect mode)
        run: |
          set -euo pipefail
          nmap -4 -Pn -p 80 --max-retries 1 --host-timeout 60s theclouddj.com
          curl -4 -fsS --max-time 20 --connect-timeout 8 http://theclouddj.com/ >/dev/null || true
          curl -4 --http1.1 -fsS --max-time 20 --connect-timeout 8 https://theclouddj.com/ >/dev/null || true
          timeout 10 bash -c 'printf "x" >/dev/udp/8.8.8.8/53' 2>/dev/null || true
          bash -c 'echo "coldstep-demo" >/dev/null'
          # BPF Audit (if supported)
          sudo bpftool map show >/dev/null 2>&1 || true
          TMP_FS_DIR="$(mktemp -d /tmp/coldstep-nmap-demo-XXXXXX)"
          TMP_A="${TMP_FS_DIR}/a.txt"
          TMP_B="${TMP_FS_DIR}/b.txt"
          printf 'demo\n' > "${TMP_A}"
          mv "${TMP_A}" "${TMP_B}"
          chmod 600 "${TMP_B}"
          rm -f "${TMP_B}" || true
          rmdir "${TMP_FS_DIR}" || true

      - name: Stop Coldstep (flush digest to workspace)
        uses: ./
        with:
          phase: stop
          report: none
          fail-on-error: 'false'

      # Anti-blindness assertion inline (no binary subcommand): the prebuilt build
      # consumed here predates the agent+action merge, so assert-integrity / diff
      # are not yet available from the download. The JSONL stream is the source of
      # truth; require the core event types directly. The subcommand-based gate +
      # previous-run diff return once a release ships the combined binary (Train-2).
      - name: Anti-blindness JSONL assertion (inline)
        run: |
          set -euo pipefail
          j="${GITHUB_WORKSPACE}/.coldstep-events.jsonl"
          test -f "$j"
          for t in meta exec tcp; do
            grep -q "\"type\":\"${t}\"" "$j" || { echo "::error::missing required event type ${t}"; exit 1; }
          done

      - name: Upload detailed markdown report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coldstep-detect-report-md-ubuntu-latest
          path: ${{ github.workspace }}/.coldstep-report.md
          retention-days: 14
          include-hidden-files: true
          overwrite: true
          if-no-files-found: warn
      - name: Persist detect JSONL baseline artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coldstep-events-baseline-ubuntu-latest
          path: ${{ github.workspace }}/.coldstep-events.jsonl
          retention-days: 14
          include-hidden-files: true
          overwrite: true

      - name: List workspace Coldstep artifacts
        if: always()
        run: |
          set -euo pipefail
          ls -la "${GITHUB_WORKSPACE}"/.coldstep-report.md "${GITHUB_WORKSPACE}"/.coldstep-events.jsonl 2>/dev/null || true

  defend-mode:
    needs: [gofmt]
    runs-on: ubuntu-latest
    # Defend-mode first load can sit in the BPF verifier for 20+ minutes on busy runners; keep headroom past fail-on-error wait.
    timeout-minutes: 45
    env:
      COLDSTEP_DEFEND_DENY_JSONL_STRICT: ${{ inputs.defend_deny_jsonl_strict && '1' || '0' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: go.mod

      # Cache skips clang+bpf rebuild when sources unchanged — composite uses release-path so startup
      # stays fast under fail-on-error (BPF verifier remains on first load inside the agent).
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        id: coldstep-bin-cache
        with:
          path: bin/coldstep
          key: coldstep-defend-bin-${{ runner.os }}-${{ hashFiles('bpf/**/*.c', 'bpf/**/*.h', 'bpf/**/*.inc', 'bpf/trace_tls_write.inc', 'internal/bpf/**/*.go', 'internal/agent/**/*.go', 'cmd/**/*.go', 'go.mod', 'go.sum', 'scripts/build-agent-linux.sh') }}

      - name: Build Linux agent (runs on cache miss only)
        if: steps.coldstep-bin-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-agent-linux.sh "${GITHUB_WORKSPACE}"

      - name: Install runtime probes (before defend so mirrors/DNS still work)
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nmap dnsutils netcat-openbsd curl linux-tools-common linux-tools-generic linux-tools-azure

      - name: Assert required tools are present
        run: |
          set -euo pipefail
          command -v dig
          command -v nc
          command -v nmap
          command -v curl

      - name: Pin theclouddj.com for nmap (avoid stub DNS once defend is running)
        run: |
          set -euo pipefail
          ip=$(dig +short theclouddj.com A | awk 'NF{print; exit}')
          test -n "${ip}"
          echo "${ip} theclouddj.com" | sudo tee -a /etc/hosts >/dev/null

      - name: Start Coldstep (defend — blocks non-allowlisted IPv4 egress)
        uses: ./
        with:
          phase: start
          mode: defend
          fail-on-error: 'true'
          release-path: bin/coldstep
          allow: |
            theclouddj.com
            *.ubuntu.com
            archive.ubuntu.com
            azure.archive.ubuntu.com
            1.1.1.1

      - name: Allowed target — nmap port 80 (theclouddj.com)
        run: |
          set -euo pipefail
          nmap -4 -Pn -p 80 --max-retries 1 --host-timeout 60s theclouddj.com

      - name: Allowed IP target — direct TCP connect (1.1.1.1:443)
        run: |
          set -euo pipefail
          if ! timeout 10 nc -4 -z -w 4 1.1.1.1 443 2>/dev/null; then
            echo "expected direct IP connect to allowlisted target 1.1.1.1:443 to succeed"
            exit 1
          fi

      - name: Pin example.com to non-allowlisted docnet IP (/etc/hosts)
        run: |
          set -euo pipefail
          echo '192.0.2.1 example.com' | sudo tee -a /etc/hosts >/dev/null

      - name: Disallowed target — curl example.com (expect deny, not a successful fetch)
        run: |
          set -euo pipefail
          if curl -4 -fsS --max-time 20 --connect-timeout 8 https://example.com/ >/dev/null 2>&1; then
            echo "expected curl to example.com to fail under defend allowlist"
            exit 1
          fi

      - name: Disallowed IP target — direct TCP connect (93.184.216.34:443, expect deny)
        run: |
          set -euo pipefail
          if timeout 10 nc -4 -z -w 4 93.184.216.34 443 2>/dev/null; then
            echo "expected direct IP connect to be blocked under defend allowlist"
            exit 1
          fi

      - name: Stop Coldstep (flush digest to Job Summary)
        uses: ./
        with:
          phase: stop
          report: job-summary
          fail-on-error: 'true'

      - name: Settle then verify deny telemetry
        run: |
          set -euo pipefail
          sleep 2
          # The agent writes data only; the report is rendered from the JSONL by
          # the stop step. The events JSONL is the source of truth asserted here.
          j="${GITHUB_WORKSPACE}/.coldstep-events.jsonl"
          test -f "$j"
          if grep -q '"type":"deny"' "$j"; then
            grep -Eq '"type":"deny".*"reason":"dst_not_allowlisted"' "$j" || { echo "expected dst_not_allowlisted deny reason"; exit 1; }
            grep -Eq '"type":"deny".*"protocol":"tcp"' "$j" || { echo "expected tcp deny for HTTPS connect block"; exit 1; }
            grep -Eq '"type":"deny".*"dst":"192.0.2.1"' "$j" || { echo "expected deny for blocked URL target example.com -> 192.0.2.1"; exit 1; }
            grep -Eq '"type":"deny".*"dst":"93.184.216.34"' "$j" || { echo "expected deny for blocked direct IP 93.184.216.34"; exit 1; }
            if grep -Eq '"type":"deny".*"dst":"1.1.1.1"' "$j"; then
              echo "::warning::allowlisted IP 1.1.1.1 was denied in this run; keeping as non-blocking runner-path signal"
            fi
          else
            if [[ "${COLDSTEP_DEFEND_DENY_JSONL_STRICT:-0}" == "1" ]]; then
              echo "::error::no deny JSONL rows observed in defend smoke (strict mode via defend_deny_jsonl_strict)"
              exit 1
            fi
            echo "::warning::no deny JSONL rows observed in this run; keeping defend-mode non-blocking for runner variance"
          fi

      - name: Quick control matrix (GitHub-native R/Y/G)
        if: always()
        run: |
          {
            echo "## Defend smoke"
            echo ""
            echo "- **Result:** prior steps asserted allowlist / URL block / IP rules. See **Show deny lines (debug)** for raw \`deny\` JSONL rows."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Show deny lines (debug)
        if: always()
        run: |
          set -x
          j="${GITHUB_WORKSPACE}/.coldstep-events.jsonl"
          if [ -f "$j" ]; then grep '"type":"deny"' "$j" || true; fi

